variables:
  StudyTime:
    raw_columns: ["studytime"]
    states: ["Low", "Medium", "High"]
    description: "Weekly study time: Low (1: <2 hrs), Medium (2: 2-5 hrs), High (3: 5-10 hrs or 4: >10 hrs)"
    mapping:
      1: "Low"
      2: "Medium"
      3: "High"
      4: "High"

  Attendance:
    raw_columns: ["absences"]
    states: ["Poor", "Average", "Good"]
    description: "School attendance based on absences count: Poor (>10), Average (4-10), Good (<4)"
    bins:
      - condition: "absences > 10"
        state: "Poor"
      - condition: "absences >= 4 and absences <= 10"
        state: "Average"
      - condition: "absences < 4"
        state: "Good"

  PastFailures:
    raw_columns: ["failures"]
    states: ["None", "Some"]
    description: "Number of past class failures: None (0), Some (>=1)"
    bins:
      - condition: "failures == 0"
        state: "None"
      - condition: "failures > 0"
        state: "Some"

  PriorGrade:
    raw_columns: ["G1"]
    states: ["Low", "Mid", "High"]
    description: "First period grade (0-20 scale): Low (<10), Mid (10-14), High (>=15)"
    bins:
      - condition: "G1 < 10"
        state: "Low"
      - condition: "G1 >= 10 and G1 < 15"
        state: "Mid"
      - condition: "G1 >= 15"
        state: "High"

  ParentEdu:
    raw_columns: ["Medu", "Fedu"]
    states: ["Low", "High"]
    description: "Maximum of mother's and father's education: Low (0-2: none to primary), High (3-4: secondary to higher)"
    formula: "max(Medu, Fedu) >= 3 ? 'High' : 'Low'"

  Support:
    raw_columns: ["famsup", "schoolsup"]
    states: ["None", "Some"]
    description: "Educational support: Some if either famsup=='yes' or schoolsup=='yes', else None"
    formula: "(famsup == 'yes' or schoolsup == 'yes') ? 'Some' : 'None'"

  Motivation:
    raw_columns: ["higher"]
    states: ["Low", "High"]
    description: "Wants to take higher education: High ('yes'), Low ('no')"
    mapping:
      "yes": "High"
      "no": "Low"

  Distraction:
    raw_columns: ["Dalc", "goout"]
    states: ["Low", "High"]
    description: "Composite index of workday alcohol (1-5) and going out (1-5): High (Dalc + goout > 4), Low (<=4)"
    formula: "(Dalc + goout > 4) ? 'High' : 'Low'"

  Internet:
    raw_columns: ["internet"]
    states: ["No", "Yes"]
    description: "Internet access at home: Yes ('yes'), No ('no')"
    mapping:
      "yes": "Yes"
      "no": "No"

  FinalGrade:
    raw_columns: ["G3"]
    states: ["Fail", "Pass", "Excellent"]
    description: "Final exam grade (0-20 scale): Fail (<10), Pass (10-14), Excellent (>=15)"
    bins:
      - condition: "G3 < 10"
        state: "Fail"
      - condition: "G3 >= 10 and G3 < 15"
        state: "Pass"
      - condition: "G3 >= 15"
        state: "Excellent"
