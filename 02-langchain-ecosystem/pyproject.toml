[project]
name = "02-langchain-ecosystem"
version = "0.1.0"
description = "Intensive LangChain, LangGraph, and LangSmith Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.20",
    "langsmith>=0.1.100",
    "qdrant-client>=1.11.0",
    "langchain-qdrant>=0.1.4",
    "pydantic>=2.8.0",
    "pypdf>=4.3.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.2.0",
    "ipywidgets>=8.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "grandalf>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]